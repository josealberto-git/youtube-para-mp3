<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Converter PRO</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0b0b;
  color:#fff;
}

.header{
  padding:15px;
  background:#111;
  color:red;
  font-weight:bold;
}

.container{
  max-width:800px;
  margin:auto;
  padding:20px;
}

.card{
  background:#181818;
  padding:20px;
  border-radius:12px;
}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}

button{
  background:red;
  color:white;
  cursor:pointer;
}

.thumb{
  width:100%;
  margin-top:10px;
  border-radius:10px;
  display:none;
}

.bar{
  height:20px;
  background:#333;
  border-radius:10px;
  margin-top:10px;
  overflow:hidden;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg, red, orange);
}

.status{
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">🎬 Converter PRO</div>

<div class="container">
  <div class="card">

    <input id="link" placeholder="Cole o link do vídeo">

    <select id="format">
      <option value="mp3">MP3</option>
      <option value="mp4">MP4</option>
    </select>

    <button onclick="start()">Converter</button>

    <img id="thumb" class="thumb">

    <div class="bar">
      <div id="fill" class="fill"></div>
    </div>

    <div id="status" class="status"></div>

  </div>
</div>

<script>
async function start(){
  const link = document.getElementById("link").value;
  const format = document.getElementById("format").value;

  const status = document.getElementById("status");
  const fill = document.getElementById("fill");
  const thumb = document.getElementById("thumb");

  if(!link){
    alert("Cole um link!");
    return;
  }

  status.innerText = "Carregando...";

  try{
    // thumbnail
    let info = await fetch("https://SEU-APP.onrender.com/info?link=" + encodeURIComponent(link));
    let data = await info.json();

    if(data.thumb){
      thumb.src = data.thumb;
      thumb.style.display = "block";
    }

    const evt = new EventSource(
      "https://SEU-APP.onrender.com/progress?link=" +
      encodeURIComponent(link) + "&format=" + format
    );

    evt.onmessage = (e) => {
      let d = JSON.parse(e.data);

      if(d.done){
        fill.style.width = "100%";

        let url = "https://SEU-APP.onrender.com/" + d.file;
        status.innerHTML = `<a href="${url}" target="_blank">⬇️ Baixar</a>`;

        evt.close();
        return;
      }

      if(d.percent){
        fill.style.width = d.percent + "%";
      }

      status.innerHTML = `
        ${d.percent || 0}%<br>
        ⚡ ${d.speed || "..."}<br>
        ⏱ ${d.eta || "..."}
      `;
    };

  }catch{
    status.innerText = "Erro!";
  }
}
</script>

</body>
</html>
